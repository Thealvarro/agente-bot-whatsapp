<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-label="bot-whatsapp: crea un bot de WhatsApp conversando, sin ver una linea de codigo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22344a"/>
      <stop offset="55%" stop-color="#2e4460"/>
      <stop offset="100%" stop-color="#24384f"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#c9d6ea"/>
      <stop offset="100%" stop-color="#a9c0e0"/>
    </linearGradient>
    <linearGradient id="chatBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efeae2"/>
      <stop offset="100%" stop-color="#e7e1d9"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0d1725" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="42" result="b"/>
      <feMerge><feMergeNode in="b"/></feMerge>
    </filter>
    <clipPath id="phoneClip">
      <rect x="778" y="74" width="392" height="412" rx="26"/>
    </clipPath>
  </defs>

  <rect width="1280" height="560" fill="url(#bg)"/>
  <circle cx="1010" cy="150" r="150" fill="#25d366" opacity="0.13" filter="url(#glow)"/>
  <circle cx="150" cy="470" r="120" fill="#ee6c4d" opacity="0.10" filter="url(#glow)"/>

  <!-- ================= IZQUIERDA ================= -->
  <g transform="translate(78,96)">
    <g>
      <rect x="0" y="0" width="132" height="27" rx="13.5" fill="#25d366" opacity="0.16"/>
      <circle cx="16" cy="13.5" r="4" fill="#25d366"/>
      <text x="28" y="18" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" font-weight="600" fill="#7fe3a6" letter-spacing="0.4">Claude Code</text>
    </g>

    <text y="98" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="66" font-weight="800" fill="url(#titleGrad)" letter-spacing="-2">bot-whatsapp</text>

    <text y="146" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="23" font-weight="500" fill="#c9d6ea">Crea un bot de WhatsApp <tspan font-weight="700" fill="#ffffff">conversando</tspan>.</text>
    <text y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="23" font-weight="500" fill="#8fa8c8">Sin ver una línea de código.</text>

    <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15.5" fill="#b9cbe4">
      <g transform="translate(0,222)">
        <path d="M2 6 L7 11 L16 1" stroke="#25d366" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="30" y="10">Se prueba <tspan font-weight="700" fill="#ffffff">antes</tspan> de conectar WhatsApp</text>
      </g>
      <g transform="translate(0,258)">
        <path d="M2 6 L7 11 L16 1" stroke="#25d366" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="30" y="10"><tspan font-weight="700" fill="#ffffff">51 controles</tspan> de seguridad antes de encender</text>
      </g>
      <g transform="translate(0,294)">
        <path d="M2 6 L7 11 L16 1" stroke="#25d366" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="30" y="10">El dueño aprueba cada respuesta <tspan font-weight="700" fill="#ffffff">al principio</tspan></text>
      </g>
    </g>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="600">
      <g transform="translate(0,344)">
        <rect width="132" height="29" rx="7" fill="#ee6c4d"/>
        <text x="66" y="19.5" text-anchor="middle" fill="#ffffff">/bot-planificar</text>
      </g>
      <g transform="translate(140,344)">
        <rect width="104" height="29" rx="7" fill="#ffffff" opacity="0.10"/>
        <text x="52" y="19.5" text-anchor="middle" fill="#c9d6ea">/bot-costos</text>
      </g>
      <g transform="translate(252,344)">
        <rect width="104" height="29" rx="7" fill="#ffffff" opacity="0.10"/>
        <text x="52" y="19.5" text-anchor="middle" fill="#c9d6ea">/bot-probar</text>
      </g>
      <g transform="translate(364,344)">
        <rect width="118" height="29" rx="7" fill="#ffffff" opacity="0.10"/>
        <text x="59" y="19.5" text-anchor="middle" fill="#c9d6ea">/bot-conectar</text>
      </g>
      <g transform="translate(0,382)">
        <rect width="111" height="29" rx="7" fill="#ffffff" opacity="0.10"/>
        <text x="55.5" y="19.5" text-anchor="middle" fill="#c9d6ea">/bot-revisar</text>
      </g>
      <g transform="translate(119,382)">
        <rect width="118" height="29" rx="7" fill="#ffffff" opacity="0.10"/>
        <text x="59" y="19.5" text-anchor="middle" fill="#c9d6ea">/bot-publicar</text>
      </g>
      <g transform="translate(245,382)">
        <rect width="114" height="29" rx="7" fill="#ffffff" opacity="0.10"/>
        <text x="57" y="19.5" text-anchor="middle" fill="#c9d6ea">/bot-bandeja</text>
      </g>
      <g transform="translate(367,382)">
        <rect width="104" height="29" rx="7" fill="#ffffff" opacity="0.10"/>
        <text x="52" y="19.5" text-anchor="middle" fill="#c9d6ea">/bot-soltar</text>
      </g>
      <g transform="translate(479,382)">
        <rect width="118" height="29" rx="7" fill="#ffffff" opacity="0.10"/>
        <text x="59" y="19.5" text-anchor="middle" fill="#c9d6ea">/bot-entregar</text>
      </g>
    </g>
  </g>

  <!-- ================= TELÉFONO ================= -->
  <g filter="url(#soft)">
    <rect x="768" y="64" width="412" height="432" rx="34" fill="#0f1d2e"/>
    <rect x="778" y="74" width="392" height="412" rx="26" fill="url(#chatBg)"/>
  </g>

  <g clip-path="url(#phoneClip)">
    <rect x="778" y="74" width="392" height="56" fill="#075e54"/>
    <circle cx="812" cy="102" r="15" fill="#25d366" opacity="0.9"/>
    <path d="M806 102 a6 6 0 1 1 12 0 a6 6 0 1 1 -12 0" fill="#075e54" opacity="0.35"/>
    <text x="838" y="98" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14.5" font-weight="700" fill="#ffffff">Estilo Marisol</text>
    <text x="838" y="115" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#a7d9c9">asistente · en línea</text>

    <!-- entrante -->
    <g>
      <rect x="796" y="150" width="214" height="34" rx="10" fill="#ffffff"/>
      <path d="M796 158 L788 152 L796 152 Z" fill="#ffffff"/>
      <text x="808" y="172" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" fill="#111b21">hola, cuánto sale el corte?</text>
    </g>

    <!-- saliente -->
    <g>
      <rect x="866" y="196" width="286" height="96" rx="10" fill="#d9fdd3"/>
      <path d="M1152 204 L1160 198 L1152 198 Z" fill="#d9fdd3"/>
      <text font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" fill="#111b21">
        <tspan x="878" y="218">¡Hola! 👋 Soy el asistente de</tspan>
        <tspan x="878" y="237">Estilo Marisol. El corte de mujer</tspan>
        <tspan x="878" y="256">está en $12.000 y dura una hora.</tspan>
        <tspan x="878" y="275">¿Te busco un horario?</tspan>
      </text>
      <text x="1142" y="287" text-anchor="end" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.5" fill="#667781">14:32</text>
    </g>

    <!-- entrante -->
    <g>
      <rect x="796" y="304" width="160" height="34" rx="10" fill="#ffffff"/>
      <path d="M796 312 L788 306 L796 306 Z" fill="#ffffff"/>
      <text x="808" y="326" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" fill="#111b21">sí, para el jueves</text>
    </g>

    <!-- saliente -->
    <g>
      <rect x="900" y="350" width="252" height="58" rx="10" fill="#d9fdd3"/>
      <path d="M1152 358 L1160 352 L1152 352 Z" fill="#d9fdd3"/>
      <text font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" fill="#111b21">
        <tspan x="912" y="372">El jueves tengo 11:00 y 16:30.</tspan>
        <tspan x="912" y="391">¿Cuál te acomoda?</tspan>
      </text>
      <text x="1142" y="403" text-anchor="end" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.5" fill="#667781">14:33</text>
    </g>

    <!-- barra de entrada -->
    <rect x="778" y="430" width="392" height="56" fill="#f0f2f5"/>
    <rect x="794" y="444" width="316" height="30" rx="15" fill="#ffffff"/>
    <text x="810" y="464" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#8696a0">Escribe un mensaje</text>
    <circle cx="1138" cy="459" r="17" fill="#25d366"/>
    <path d="M1131 459 L1145 452 L1140 459 L1145 466 Z" fill="#ffffff"/>
  </g>

  <!-- ================= PIE ================= -->
  <text x="78" y="524" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#7d93b3">Desarrollado por alvarocofre.dev</text>
</svg>
